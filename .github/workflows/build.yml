name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: release (default, arm64-v8a, signed) or debug (all ABIs, debug-signed)'
        required: false
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (i18n translation audit included)
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug

      - name: Decode signing keystore
        if: env.BUILD_TYPE != 'debug'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/furflix-release.p12"

      - name: Build signed release APK (arm64-v8a)
        if: env.BUILD_TYPE != 'debug'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/furflix-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Pabi=arm64-v8a --stacktrace

      - name: Verify signature
        if: env.BUILD_TYPE != 'debug'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload release APK (arm64-v8a)
        if: env.BUILD_TYPE != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: FurFlix-release-arm64-v8a
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: FurFlix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
